[project]
name = "egx-monitor"
version = "0.1.0"
description = "Egyptian Exchange (EGX) market monitor — desktop dashboard"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "websockets>=12.0", "pywebview>=5.0", "tzdata>=2024.1"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["F", "E", "W", "I"]
ignore = ["E741"]
